name: LibreLane (RTL to GDSII)

# Full SKY130 hardening with LibreLane (the maintained successor to OpenLane 2):
# synthesis, floorplan/PDN, placement, CTS, routing with antenna repair,
# Magic/KLayout DRC, LVS and multi-corner STA. Takes a while, so it runs only
# when the hardware or its configuration changes, or on demand.
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "config.json"
      - ".github/workflows/openlane.yml"

env:
  LIBRELANE_VERSION: "3.0.17"

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space for the LibreLane image and PDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install LibreLane
        run: pip install "librelane==${LIBRELANE_VERSION}"

      - name: Run the flow
        run: librelane --docker-no-tty --dockerized --run-tag ci config.json

      - name: Summarise signoff metrics
        if: always()
        run: |
          M=runs/ci/final/metrics.json
          [ -f "$M" ] || { echo "No metrics.json produced" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$M" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, re, sys
          m = json.load(open(sys.argv[1]))
          pat = re.compile(
              r"^(design__die__bbox|design__core__area|design__instance__count$|design__instance__utilization$"
              r"|timing__(setup|hold)__(ws|tns)$|timing__(setup|hold)_vio__count$"
              r"|design__max_(slew|cap|fanout)_violation__count$|design__max_(slew|cap|fanout)_violation__count__corner:"
              r"|route__antenna_violation__count|antenna__violating__(nets|pins)|route__drc_errors$"
              r"|magic__drc_error__count|klayout__drc_error__count|design__lvs_error__count|route__wirelength$|route__vias$)"
          )
          print("### LibreLane signoff metrics\n\n| Metric | Value |\n|---|---|")
          for k in sorted(m):
              if pat.match(k):
                  print(f"| `{k}` | {m[k]} |")
          PY

      - name: Upload GDS, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librelane-riscv_uart_soc
          path: |
            runs/ci/final
            runs/ci/*/*.log
            runs/ci/*/*.rpt
            runs/ci/*/*/*.rpt
            runs/ci/*/reports
            runs/ci/flow.log
            runs/ci/error.log
            runs/ci/warning.log
          if-no-files-found: warn
